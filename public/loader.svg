<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
 width="256" height="256" fill="none" role="img"
 aria-label="PlayStation loading animation">
<title>PlayStation loading animation</title>

<style>
  :root { --ps-blue:#003791; }

  .logo { fill:var(--ps-blue); }

  /*
    One continuous reveal.
    The logo itself never changes shape, opacity, scale, or color.
    A soft-edged moving mask creates the "being drawn" feeling.
  */
  .reveal {
    transform-box:fill-box;
    transform-origin:center;
    animation: reveal 1.55s cubic-bezier(.45,0,.15,1) infinite;
  }

  .head {
    transform-box:fill-box;
    transform-origin:center;
    animation: head 1.55s cubic-bezier(.25,.75,.25,1) infinite;
  }

  @keyframes reveal {
    0%   { transform:translateX(-25px); }
    8%   { transform:translateX(-15px); }
    55%  { transform:translateX(7px); }
    76%  { transform:translateX(25px); }
    100% { transform:translateX(25px); }
  }

  @keyframes head {
    0%,72% { opacity:1; }
    78% { opacity:1; }
    100% { opacity:1; }
  }

  @media (prefers-reduced-motion:reduce) {
    .reveal,.head { animation:none; transform:none; }
  }
</style>

<defs>
  <!-- Moving soft reveal edge -->
  <linearGradient id="wipe" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="white" stop-opacity="0"/>
    <stop offset=".20" stop-color="white" stop-opacity=".15"/>
    <stop offset=".42" stop-color="white" stop-opacity="1"/>
    <stop offset=".72" stop-color="white" stop-opacity="1"/>
    <stop offset="1" stop-color="white" stop-opacity="0"/>
  </linearGradient>

  <mask id="movingReveal" maskUnits="userSpaceOnUse"
        x="-24" y="-2" width="72" height="28">
    <g class="reveal">
      <rect x="-24" y="-2" width="72" height="28" fill="url(#wipe)"/>
    </g>
  </mask>
</defs>

<!-- Clean original mark, revealed continuously from left to right -->
<g mask="url(#movingReveal)">
  <path class="logo" d="M8.984 2.596v17.547l3.915 1.261V6.688c0-.69.304-1.151.794-.991.636.18.76.814.76 1.505v5.875c2.441 1.193 4.362-.002 4.362-3.152 0-3.237-1.126-4.675-4.438-5.827-1.307-.448-3.728-1.186-5.39-1.502zm4.656 16.241l6.296-2.275c.715-.258.826-.625.246-.818-.586-.192-1.637-.139-2.357.123l-4.205 1.5V14.98l.24-.085s1.201-.42 2.913-.615c1.696-.18 3.785.03 5.437.661 1.848.601 2.041 1.472 1.576 2.072-.465.6-1.622 1.036-1.622 1.036l-8.544 3.107V18.86zM1.807 18.6c-1.9-.545-2.214-1.668-1.352-2.32.801-.586 2.16-1.052 2.16-1.052l5.615-2.013v2.313L4.205 17c-.705.271-.825.632-.239.826.586.195 1.637.15 2.343-.12L8.247 17v2.074c-.12.03-.256.044-.39.073-1.939.331-3.996.196-6.038-.479z"/>
</g>
</svg>
